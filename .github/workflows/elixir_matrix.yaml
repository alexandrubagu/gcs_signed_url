name: Elixir Compatibility Matrix
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    uses: mruoss/action_elixir_run_tests/.github/workflows/elixir-run-tests.yml@v2.3.2
    with:
      checkout: true
      warnings-as-errors: true
      with-kubernetes: false
      include-integration-tests: false
      extra_excludes: |
        - elixir: "1.15"
          otp: "24"
        - elixir: "1.15"
          otp: "25"
        - elixir: "1.15"
          otp: "26"
        - elixir: "1.15"
          otp: "27"
        - elixir: "1.15"
          otp: "28"
        - elixir: "1.15"
          otp: "29"
        - elixir: "1.16"
          otp: "24"
        - elixir: "1.16"
          otp: "25"
        - elixir: "1.16"
          otp: "26"
        - elixir: "1.16"
          otp: "27"
        - elixir: "1.16"
          otp: "28"
        - elixir: "1.16"
          otp: "29"
        - elixir: "1.17"
          otp: "24"
        - elixir: "1.17"
          otp: "25"
        - elixir: "1.17"
          otp: "26"
        - elixir: "1.17"
          otp: "27"
        - elixir: "1.17"
          otp: "28"
        - elixir: "1.17"
          otp: "29"
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
